{% extends "base.html" %}
{% block title %}登录 - 诺基亚助手{% endblock %}
{% block body %}
<h2>登录</h2>
{% if error %}<p><b>{{ error }}</b></p>{% endif %}
<form method="post" action="/login">
<input type="hidden" name="next" value="{{ next }}">
<p>用户名: <input type="text" name="username" size="20"></p>
<p>密　码: <input type="password" name="password" size="20"></p>
<p><input type="submit" value="登录"></p>
</form>
<p>没有账号？[<a href="/register">注册</a>]</p>
{% endblock %}
