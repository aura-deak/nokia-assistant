{% extends "base.html" %}
{% block title %}网页辅助浏览 - 诺基亚助手{% endblock %}
{% block body %}
<h2>网页辅助浏览</h2>
<p>服务器代为抓取，去除样式/脚本/图片/注释，输出纯文字页；超大页面自动分页。</p>
<form method="get" action="/browse">
<p>网址:<br><input type="text" name="url" size="28"></p>
<p><input type="submit" value="打开网页"></p>
</form>
<form method="get" action="/browse/search">
<p>搜索:<br><input type="text" name="q" size="28"></p>
<p><input type="submit" value="搜索(wiby)"></p>
<p>我知道wiby很难用。但是这是为数不多允许抓取的搜索引擎</p>
</form>
<hr>
<p>快捷入口:<br>
{% for l in links %}[<a href="/browse?url={{ l.url|urlencode }}">{{ l.name }}</a>]
{% if l.custom %}<form method="post" action="/browse/links/{{ l.lid }}/delete"><input type="submit" value="删"></form>{% endif %}
{% endfor %}</p>
<p>添加快捷入口:<br>
<form method="post" action="/browse/links/add">
名称:<input type="text" name="name" size="10"><br>
网址:<input type="text" name="url" size="22"><br>
<input type="submit" value="添加"></p>
</form>
{% endblock %}
